<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collective Coffee House</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<h2>Collective Coffee House ☕</h2>

<button onclick="payNow(500)">Pay ₹500</button>

<script>
async function payNow(amount){

  const res = await fetch('http://localhost:5000/create-order',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({amount})
  });

  const data = await res.json();

  var options = {
    "key": "YOUR_KEY_ID",
    "amount": data.amount,
    "currency": "INR",
    "name": "Collective Coffee House",
    "order_id": data.id,

    "handler": async function (response){
        await fetch('http://localhost:5000/verify-payment',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            paymentId: response.razorpay_payment_id,
            amount: amount
          })
        });

        alert("Payment Successful!");
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
